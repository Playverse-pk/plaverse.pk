<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script>
        (function() {
            var redirect = sessionStorage.redirect;
            delete sessionStorage.redirect;
            if (redirect && redirect != location.href) {
                // If a redirect was stored, use replaceState to restore the original URL
                history.replaceState(null, null, redirect);
            }
        })();
    </script>
    <script>
        // Use a simple, immediate redirect back to index.html
        var path = location.pathname;
        if (!path.endsWith('/')) {
            path += '/'; // Ensure a trailing slash if needed by your GoRouter setup
        }
        
        // This causes the browser to load index.html, and the GoRouter 
        // will then pick up the correct path (e.g., /privacy-policy)
        location.replace(location.origin + path); 
    </script>
</head>
<body>
</body>
</html>
